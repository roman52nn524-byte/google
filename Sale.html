<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#fffafb;color:#294a40;font:14px Arial}main{padding:20px 26px 100px}h1{font-size:25px;font-weight:500;margin:0 0 20px}section,details{border:1px solid #eadfe3;border-radius:16px;margin:12px 0;overflow:hidden;background:white}h2,summary{font-size:14px;margin:0;padding:13px 16px;background:#f6e4eb;color:#93425f}summary{background:#e4f1eb;cursor:pointer}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}label{display:block;font-size:12px;color:#666}input,select,textarea{width:100%;border:1px solid #dcdadc;border-radius:9px;padding:11px;margin-top:6px;font:14px Arial;color:#294a40;background:white}input[type=checkbox]{width:auto;accent-color:#b95e7d}textarea{resize:vertical}.line{display:grid;grid-template-columns:1fr 75px 105px 90px 32px;gap:9px;align-items:end;margin:12px 16px}.line button{padding:10px;border:0;background:#fcebf1;color:#b95e7d;border-radius:30px;cursor:pointer}.hint{color:#75867d;font-size:12px;margin:12px 16px}button{cursor:pointer;border:1px solid #bdd5ca;border-radius:9px;padding:12px 18px;background:#ecf6f0;color:#355f50;font-weight:bold}.add{margin:6px 16px 16px}.totals{display:flex;gap:12px;margin:16px}.card{flex:1;background:#e7f3ed;border-radius:12px;padding:14px}.card:first-child{background:#fae9ef}.card strong{display:block;font-size:22px;margin-top:7px}footer{position:fixed;bottom:0;background:#fffafb;width:100%;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee}.save{background:#b95e7d;color:white;border:0}.error{color:#ae3457;white-space:pre-wrap}button:disabled{opacity:.5;cursor:wait}
</style><main><h1>🎆 Новая продажа</h1><section><h2>Заказ</h2><div class="fields"><label>Дата *<input id="date" type="date"></label><label>Канал *<select id="channel"><option>Авито</option><option>Розница</option><option>ВКонтакте</option><option>Телеграм</option><option>Сайт</option><option>Сарафан</option><option>Другое</option></select></label><label>Комментарий<input id="comment"></label></div></section>
<details open><summary>Клиент и получатель</summary><div class="fields"><label>Клиент *<input id="client"></label><label>Телефон<input id="phone" type="tel"></label><label><input type="checkbox" id="same" checked> Получатель — клиент</label><label>Получатель<input id="recipient" disabled></label><label>Телефон получателя<input id="recipientPhone" disabled></label></div></details>
<details><summary>Доставка</summary><div class="fields"><label><input type="checkbox" id="pickup" checked> Самовывоз</label><label>Дата доставки<input id="deliveryDate" type="date"></label><label>Время<input id="time" placeholder="18:00–19:00"></label><label>Адрес<input id="address"></label><label>Курьер<input id="courier"></label><label>Телефон курьера<input id="courierPhone" type="tel"></label><label>Плата за доставку, ₽<input id="delivery" type="number" value="0" min="0" step="0.01"></label><label><input type="checkbox" id="deliveryPaid"> Доставка оплачена</label></div></details>
<section><h2>Состав заказа</h2><div id="lines"></div><button class="add" id="add" disabled>+ Добавить товар</button><p class="hint">Цена берется из каталога, ее можно изменить. Закупка фиксируется на момент продажи.</p><div class="fields"><label>Оплачено товаров, ₽<input id="paid" type="number" value="0" min="0" step="0.01"></label><label><input id="full" type="checkbox"> Товары оплачены полностью</label></div><div class="totals"><div class="card">Товары<strong id="total">0 ₽</strong></div><div class="card">Закупка<strong id="cost">0 ₽</strong></div><div class="card">Валовая прибыль<strong id="profit">0 ₽</strong></div></div><p class="hint" id="due"></p></section></main><footer><span id="message" role="status">Загрузка каталога…</span><button class="save" id="save" disabled>Сохранить продажу</button></footer>
<script>
let products=[],token=crypto.randomUUID(),busy=false;const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(n||0);
function add(){const el=document.createElement('div');el.className='line';el.innerHTML='<label>Товар<select class="product"></select></label><label>Кол-во<input class="qty" type="number" min="1" step="1" value="1"></label><label>Цена, ₽<input class="price" type="number" min="0.01" step="0.01"></label><span class="stock hint"></span><button type="button" aria-label="Удалить товар">×</button>';const sel=el.querySelector('select');products.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=`${p.sku} · ${p.name}${p.variant?' · '+p.variant:''} (${p.available} шт.)`;sel.appendChild(o)});sel.onchange=()=>{const p=products.find(p=>p.id===sel.value);el.querySelector('.price').value=p.price;el.querySelector('.stock').textContent='В наличии: '+p.available;calc()};el.querySelector('button').onclick=()=>{el.remove();calc()};el.oninput=calc;$('lines').appendChild(el);sel.onchange()}
function items(){return [...document.querySelectorAll('.line')].map(el=>({id:el.querySelector('select').value,qty:Number(el.querySelector('.qty').value),price:Number(el.querySelector('.price').value)}))}
function calc(){let total=0,cost=0;items().forEach(x=>{total+=x.qty*x.price;cost+=x.qty*(products.find(p=>p.id===x.id)?.cost||0)});$('total').textContent=money(total);$('cost').textContent=money(cost);$('profit').textContent=money(total-cost);$('paid').disabled=$('full').checked;$('due').textContent='К получению с доставкой: '+money(total-($('full').checked?total:Number($('paid').value))+($('deliveryPaid').checked?0:Number($('delivery').value)))}
['paid','full','delivery','deliveryPaid'].forEach(id=>$(id).oninput=calc);$('same').onchange=()=>{['recipient','recipientPhone'].forEach(id=>$(id).disabled=$('same').checked)};
$('add').onclick=add;$('date').value=new Date().toLocaleDateString('sv-SE');
$('save').onclick=()=>{if(busy)return;const p={token,items:items()};['date','channel','client','phone','recipient','recipientPhone','comment','deliveryDate','time','address','courier','courierPhone','delivery','paid'].forEach(id=>p[id]=$(id).value);['pickup','deliveryPaid','full'].forEach(id=>p[id]=$(id).checked);if($('same').checked){p.recipient=p.client;p.recipientPhone=p.phone}if(!p.client.trim()||!p.date||!p.items.length){$('message').textContent='Укажите клиента, дату и товары';return}if(!p.pickup&&(!p.address.trim()||!p.deliveryDate)){$('message').textContent='Укажите дату и адрес доставки';return}busy=true;$('save').disabled=true;$('message').textContent='Сохраняем…';google.script.run.withSuccessHandler(r=>{$('message').className='';$('message').textContent='✓ Продажа '+r.id+' сохранена';$('save').textContent='Готово';$('save').disabled=false;$('save').onclick=()=>google.script.host.close()}).withFailureHandler(e=>{busy=false;$('save').disabled=false;$('message').className='error';$('message').textContent=e.message}).saveSale(p)};
google.script.run.withSuccessHandler(data=>{products=data.filter(p=>p.available>0);if(!products.length){$('message').textContent='Нет доступных товаров. Проверьте склад.';return}$('add').disabled=false;$('save').disabled=false;$('message').textContent='Новая продажа списывает товар со склада';add()}).withFailureHandler(e=>{$('message').textContent=e.message}).catalog();
</script></html>
